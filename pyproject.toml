[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balanceroute"
version = "0.1.0a1"
description = "BalanceRoute routing algorithms and reproducible CPU simulation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
plot = ["matplotlib>=3.8,<4"]

[project.scripts]
balanceroute = "balanceroute.cli:main"

[project.urls]
Repository = "https://github.com/b010001y/BalanceRoute"
Issues = "https://github.com/b010001y/BalanceRoute/issues"
Paper = "https://arxiv.org/abs/2605.06113"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
balanceroute = ["presets/*.json", "reference/r16/*.json", "reference/r16/inputs/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
