name: Tests and reference replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-repro.txt
      - run: python -m pip install -r requirements-repro.txt
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  complete-reference:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-repro.txt
      - run: python -m pip install -r requirements-repro.txt
      - run: python -m pip install .
      - run: balanceroute reproduce --workers 2 --output results/r16
      - run: balanceroute verify results/r16
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r16-reproduction
          path: results/r16
